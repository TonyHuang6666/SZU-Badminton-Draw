name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BadmintonDraw.sln --locked-mode -p:Configuration=Release

      - name: Audit NuGet dependencies
        shell: bash
        run: scripts/check-vulnerable-packages.sh BadmintonDraw.sln

      - name: Build
        run: dotnet build BadmintonDraw.sln -c Release --no-restore

      - name: Test
        run: dotnet test BadmintonDraw.sln -c Release --no-build --verbosity normal

      - name: Publish smoke test
        run: dotnet publish src\BadmintonDraw.Desktop\BadmintonDraw.Desktop.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true

  macos-build-test-publish:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BadmintonDraw.sln --locked-mode -p:Configuration=Release

      - name: Audit NuGet dependencies
        run: scripts/check-vulnerable-packages.sh BadmintonDraw.sln

      - name: Build
        run: dotnet build BadmintonDraw.sln -c Release --no-restore

      - name: Test
        run: dotnet test BadmintonDraw.sln -c Release --no-build --verbosity normal

      - name: Build macOS app and DMG
        run: bash scripts/publish-macos.sh osx-arm64

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: SZU-Badminton-Draw_macos-arm64
          path: artifacts/macos/osx-arm64/SZU-Badminton-Draw_osx-arm64.dmg
          if-no-files-found: error
